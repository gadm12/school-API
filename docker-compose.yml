services:
  db:
    build: ./db
    container_name: db-container
    env_file:
      - ./school_proj/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis-container
    env_file:
      - ./school_proj/.env
    ports:
      - "6379:6379"

  backend:
    build: ./school_proj
    container_name: django-container
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./school_proj/.env
    ports:
      - "8000:8000"
    volumes:
      - ./school_proj:/app
    depends_on:
      - db
      - redis

  nginx:
    image: nginx:alpine
    container_name: nginx-container
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./client/dist:/usr/share/nginx/html
    depends_on:
      - backend

volumes:
  postgres_data:
