services:
  db:
    build: ./db
    container_name: db-container
    env_file:
      - ./school_proj/.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./school_proj
    container_name: django-container
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - ./school_proj/.env
    ports:
      - "8000:8000"
    volumes:
      - ./school_proj:/app
    depends_on:
      - db

  frontend:
    build: ./client
    container_name: react-container
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./client:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
